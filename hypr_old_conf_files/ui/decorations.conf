# ============================
# GENERAL APPEARANCE
# ============================


general {

    gaps_in = 1

    gaps_out = 0

    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg

    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}



# ============================
# WINDOW DECORATION
# ============================

decoration {

    rounding = 10

    rounding_power = 2


    active_opacity = 1.0

    inactive_opacity = 0.5


    shadow {

        enabled = false

        range = 4

        render_power = 3

        color = rgba(1a1a1aee)
    }


    blur {

        enabled = false

        size = 3

        passes = 0

        vibrancy = 0.1696
    }
}



# ============================
# DWINDLE LAYOUT
# ============================

dwindle {

    preserve_split = true
}



# ============================
# MASTER LAYOUT
# ============================

master {

    new_status = master
}



# ============================
# MISC
# ============================

misc {

    force_default_wallpaper = -1

    disable_hyprland_logo = false
}