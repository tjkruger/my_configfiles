general {
    lock_cmd = pidof swaylock || swaylock --screenshots --effect-blur 5x5
    before_sleep_cmd = pidof swaylock || swaylock --screenshots --effect-blur 5x5
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 30
    on-timeout = pidof swaylock || swaylock --screenshots --effect-blur 5x5
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}