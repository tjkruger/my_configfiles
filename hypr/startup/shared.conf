# ============================
# SHARED STARTUP
# ============================

# Wallpaper daemon
exec-once = swww-daemon

# Static wallpaper (temporary until rotation script is fixed)
exec-once = swww img $HOME/Pictures/Homescreen/Homescreen.png

exec-once = waybar -c ~/.config/hypr/services/shared/waybar/config.json -s ~/.config/hypr/services/shared/waybar/style.css