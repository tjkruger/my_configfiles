# ============================
# LAPTOP UTILITIES
# ============================

# System monitor
bindl = , switch:Lid Switch, exec, swaylock --screenshots --effect-blur 5x5
bind = $mainMod, L, exec, swaylock --screenshots --effect-blur 5x5
bind = $mainMod, N, exec, mate-system-monitor

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# WiFi
bindl = , XF86WLAN, exec, nmcli radio wifi $( [ "$(nmcli radio wifi)" = "enabled" ] && echo off || echo on )

# Bluetooth
bindl = , XF86Bluetooth, exec, rfkill toggle bluetooth

# Config/Settnigs
bindl = , XF86Tools, exec, code ~/.config/hypr