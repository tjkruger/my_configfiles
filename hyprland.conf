### MONITORS ###

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto


### MY PROGRAMS ###

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun


### AUTOSTART ###

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = swww-daemon
exec-once = swww img /home/r2d2/Pictures/Homescreen/Homescreen.png
exec-once = eww daemon
exec-once = sleep 1 && eww open background_clock
exec-once = pkill openrgb
exec-once = openrgb --server
exec-once = sleep 2 && openrgb -p newred
exec-once = /usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets,ssh,gpg && export $(/usr/bin/gnome-keyring-daemon --start)
exec-once = sleep 1 && /home/r2d2/Projects/DiaryApp/build/DiaryApp





### ENVIRONMENT VARIABLES ###

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita:dark


### LOOK AND FEEL ###

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.5
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = false
        size = 3
        passes = 0

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

#workspace = w[tv1], gapsout:0, gapsin:0s
#workspace = f[1], gapsout:0, gapsin:0
#windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
#windowrule = rounding 0, floating:0, onworkspace:w[tv1]
#windowrule = bordersize 0, floating:0, onworkspace:f[1]
#windowrule = rounding 0, floating:0, onworkspace:f[1]

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


### KEYBINDINGS ###

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, V, exec, /usr/bin/vivaldi
bind = $mainMod SHIFT, O, exec, sh -c 'pkill openrgb; openrgb --server; sleep 1; openrgb -p newred'
bind = $mainMod, K, killactive,
bind = $mainMod SHIFT, K, exec, sh -c 'kill -9 $(hyprctl activewindow -j | jq .pid)'
bind = $mainMod, E, exec, sh -c 'thunar'
bind = $mainMod, N, exec, sh -c 'mate-system-monitor'


# bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, F, fullscreen


bind = $mainMod, 1, workspace, 1#go to/create workspace
bind = $mainMod, 2, workspace, 2#go to/create workspace
bind = $mainMod, 3, workspace, 3#go to/create workspace
bind = $mainMod, 4, workspace, 4#go to/create workspace
bind = $mainMod, 5, workspace, 5#go to/create workspace
bind = $mainMod, 6, workspace, 6#go to/create workspace
bind = $mainMod, 7, workspace, 7#go to/create workspace
bind = $mainMod, 8, workspace, 8#go to/create workspace
bind = $mainMod, 9, workspace, 9#go to/create workspace
bind = $mainMod, 0, workspace, 10#go to/create workspace

#bind = $mainMod, L, exec,swaylock -i /home/r2d2/Pictures/lockscreen.jpg#lockscreen not nessecary for here at home
bind = $mainMod+SHIFT, S, exec, systemctl suspend#suspend ...

bind = CTRL+SHIFT, SPACE, exec, /usr/bin/playerctl play-pause#sound pause/play
bind = CTRL+SHIFT, RIGHT, exec, /usr/bin/playerctl next#sound next
bind = CTRL+SHIFT, LEFT, exec, /usr/bin/playerctl previous#sound prev

bind = ALT, Tab, workspace, e+1#switch workspaces with alt tab
bind = ALT SHIFT, Tab, workspace, +1#switch workspaces but dont loop around


bind = $mainMod SHIFT, 1, movetoworkspace, 1#move to workspace
bind = $mainMod SHIFT, 2, movetoworkspace, 2#move to workspace
bind = $mainMod SHIFT, 3, movetoworkspace, 3#move to workspace
bind = $mainMod SHIFT, 4, movetoworkspace, 4#move to workspace
bind = $mainMod SHIFT, 5, movetoworkspace, 5#move to workspace
bind = $mainMod SHIFT, 6, movetoworkspace, 6#move to workspace
bind = $mainMod SHIFT, 7, movetoworkspace, 7#move to workspace
bind = $mainMod SHIFT, 8, movetoworkspace, 8#move to workspace
bind = $mainMod SHIFT, 9, movetoworkspace, 9#move to workspace
bind = $mainMod SHIFT, 0, movetoworkspace, 10#move to workspace

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

### WINDOWS AND WORKSPACES ###

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrulev2 = opacity 1.0 1.0,class:^(DiaryApp)$
windowrulev2 = noblur,class:^(DiaryApp)$


